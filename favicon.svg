<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ground { fill: #F4F5F2 }
    .hatch  { stroke: #C8CCC6 }
    .plate  { stroke: #1B4D8F }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #15171B }
      .hatch  { stroke: #343A41 }
      .plate  { stroke: #7FAEEA }
    }
  </style>
  <rect class="ground" width="32" height="32"/>
  <defs>
    <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line class="hatch" x1="0" y1="0" x2="0" y2="6" stroke-width="2"/>
    </pattern>
  </defs>
  <rect class="plate" x="4" y="7" width="24" height="18" fill="url(#h)" stroke-width="1.5"/>
</svg>
