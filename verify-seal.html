<!doctype html><meta charset="utf-8"><title>seal verification</title>
<link rel="stylesheet" href="style.css">
<div class="measure"><div id="rig"></div></div>
<pre id="OUT" style="font:12px monospace;padding:20px;white-space:pre-wrap"></pre>
<script src="oracle.js"></script>
<script src="game.js"></script>
<script>
(function(){
  var inst = createInstrument(document.getElementById('rig'), {
    id: 'verify', label: 'rig', target: 900, extendTo: 0,
    prompt: 'x', believe: 'x', summary: function(p){return 'x';}
  });
  var plate = document.querySelector('#rig .plate');
  var readout = document.querySelector('#rig .readout');
  var fails = [], checked = 0, emptyCommit = 0;

  // Press with NO delay between presses — the adversarial case: a fast
  // player trying to act inside the 700ms reveal window.
  for (var i = 0; i < 400; i++) {
    var committed = plate.dataset.sealed;          // read BEFORE the press
    if (!committed) { emptyCommit++; continue; }
    var key = Math.random() < 0.5 ? 'F' : 'D';
    // adversarial: half the time press the opposite of whatever is committed
    if (i % 2 === 0) key = committed === 'F' ? 'D' : 'F';
    inst.press(key);
    var said = (readout.textContent.match(/Sealed ([FD])/) || [])[1];
    checked++;
    if (said !== committed) fails.push(i + ': committed=' + committed + ' scored=' + said);
  }
  var hits = inst.hits(), n = hits.length;
  var acc = hits.filter(Boolean).length / n;
  document.getElementById('OUT').textContent = 'RESULT '
    + JSON.stringify({
        presses: n,
        checkedBeforeEachPress: checked,
        missingCommitment: emptyCommit,
        mismatches: fails.length,
        firstMismatches: fails.slice(0,3),
        accuracyVsAdversary: +(acc*100).toFixed(1)
      });
})();
</script>
